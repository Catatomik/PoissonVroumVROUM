name: C

on:
  pull_request:
    paths:
      - "server/*"
      # If this workflow changes, it will run again
      - ".github/workflows/*"

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
    - uses: actions/checkout@v4
    - name: configure
      run: ./configure
    - name: Build (default rule)
      run: make
    - name: Test
      run: make test
