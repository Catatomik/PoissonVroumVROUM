name: Rust

on:
  # Manually run
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    paths:
      - "client/*"
      # If this workflow changes, it will run again
      - ".github/workflows/rust.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
    - uses: actions/checkout@v4
    - name: Format
      run: cargo fmt -- --check

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
    - uses: actions/checkout@v4
    # Required to build raylib ; need X11 headers
    # see https://github.com/glfw/glfw/issues/1957#issuecomment-908506994
    - name: Install build dependencies
      uses: awalsh128/cache-apt-pkgs-action@v1.4.3
      with:
        packages: xorg-dev
    - name: Build
      run: cargo build --verbose
    # Save built files (only dependencies, see https://github.com/Swatinem/rust-cache/tree/master?tab=readme-ov-file#cache-effectiveness)
    # Dedicated action, more optimized
    # Otherwise, check https://github.com/actions/cache/blob/main/examples.md#rust---cargo
    - name: Cache built files
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: client -> target
        shared-key: built-client-${{ hashFiles('client/Cargo.lock', 'client/Cargo.toml') }}

  # Linting would fail if it doesn't build
  # It could be run anyway, but would need to reinstall missing dependencies & build from scratch
  lint:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: client

    steps:
    - uses: actions/checkout@v4
    # Re-use previously built files
    # There should be no cache miss, but it's not fatal
    - name: Restore built files
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: client -> target
        shared-key: built-client-${{ hashFiles('client/Cargo.lock', 'client/Cargo.toml') }}
    # Required to build raylib ; need X11 headers
    # see https://github.com/glfw/glfw/issues/1957#issuecomment-908506994
    - name: Install build dependencies
      uses: awalsh128/cache-apt-pkgs-action@v1.4.3
      with:
        packages: xorg-dev
    - name: Clippy
      run: cargo clippy --no-deps -- -Dwarnings

  test:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: client

    steps:
    - uses: actions/checkout@v4
    # Re-use previously built files
    # There should be no cache miss, but it's not fatal
    - name: Restore built files
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: client -> target
        shared-key: built-client-${{ hashFiles('client/Cargo.lock', 'client/Cargo.toml') }}
    # Required to build raylib ; need X11 headers
    # see https://github.com/glfw/glfw/issues/1957#issuecomment-908506994
    - name: Install build dependencies
      uses: awalsh128/cache-apt-pkgs-action@v1.4.3
      with:
        packages: xorg-dev
    - name: Run tests
      run: cargo test --verbose
